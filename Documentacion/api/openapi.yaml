openapi: 3.1.1
info:
  title: API del SIIP Salamanca
  version: 0.1.0
  description: Borrador técnico del 26/10/2026, sin backend ni esquema aprobados. Los ejemplos DEMO son sintéticos
    y no asignaciones reales. x-estado-contrato y x-pendientes identifican lo condicionado; ningún endpoint es definitivo.
    Se conservan DEC-001..025. Primer recorrido de una dependencia con configuración conciliada; multidependencia,
    calendario, vigencias y límites PDF pendientes. No incluye CRUD de tablas, importación, chat ni publicación
    manual.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: /api/v1
  description: Base relativa propuesta, sin despliegue existente.
externalDocs:
  description: Flujos, estados y contradicciones del SIIP
  url: ../flujos-negocio.md
tags:
- name: Autenticacion
- name: Indicadores
- name: Captura
- name: Revision
- name: Validacion
- name: Administracion
- name: Consulta
- name: Evidencias
- name: Notificaciones
security:
- SesionCookie: []
paths:
  /auth/sesion:
    get:
      operationId: consultarSesion
      summary: Consultar sesión y obtener CSRF
      description: Bootstrap público técnico, también antes del login. Retorna usuario=null si no hay sesión autenticada;
        no concede acceso a otros recursos. Propuesta de cookie opaca con persistencia servidor y CSRF; framework/hosting
        y duración aún por definir.
      tags:
      - Autenticacion
      x-roles: []
      x-prioridad: P0
      x-estado-contrato: condicionado
      x-pendientes:
      - AUTENTICACION
      responses:
        '200':
          description: Consultar sesión y obtener CSRF
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Puede emitir una sesión técnica anónima para vincular el CSRF de bootstrap; no concede
                autenticación. Mismos atributos de seguridad que la sesión autenticada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                ejemplo:
                  value:
                    usuario: null
                    csrf_token: csrf_sintetico_bootstrap_2026
                autenticada:
                  value:
                    usuario:
                      id: '1'
                      nombre: Capturista de demostración
                      correo: captura@example.test
                      rol: captura
                      dependencia_id: '7'
                    csrf_token: csrf_sintetico_autenticado_2026
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      security: []
    post:
      operationId: iniciarSesion
      summary: Autenticar la cuenta
      description: Exige bootstrap CSRF y Origin autorizado. Mensaje genérico ante credenciales inválidas/cuenta
        inactiva. Rotar sesión y CSRF; no generar Bearer ni devolver contraseña.
      tags:
      - Autenticacion
      x-roles: []
      x-prioridad: P0
      x-estado-contrato: condicionado
      x-pendientes:
      - AUTENTICACION
      parameters:
      - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Autenticar la cuenta
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: siip_session opaca; HttpOnly, Secure en HTTPS, SameSite=Lax y Path=/api/v1. No exponer
                el ID en JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                ejemplo:
                  value:
                    usuario:
                      id: '1'
                      nombre: Capturista de demostración
                      correo: captura@example.test
                      rol: captura
                      dependencia_id: '7'
                    csrf_token: csrf_sintetico_rotado_2026
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
            examples:
              ejemplo:
                value:
                  correo: captura@example.test
                  password: SoloEjemploDocumental!2026
    delete:
      operationId: cerrarSesion
      summary: Invalidar sesión actual
      description: Revoca la sesión servidor actual y expira la cookie. No basta borrar almacenamiento del navegador.
        Sin sesión autenticada devuelve 401.
      tags:
      - Autenticacion
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: condicionado
      x-pendientes:
      - AUTENTICACION
      parameters:
      - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Invalidar sesión actual
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /indicadores:
    get:
      operationId: listarIndicadores
      summary: Listar indicadores autorizados
      description: Filtrar por vínculo de dependencia antes de paginar/contar. Captura solo indicadores relacionados;
        Revisión/Administrador global. Orden estable codigo,id. No acepta un filtro para ampliar el ámbito.
      tags:
      - Indicadores
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: propuesto
      x-pendientes: []
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Listar indicadores autorizados
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaIndicadores'
              examples:
                ejemplo:
                  value:
                    items:
                    - id: '63'
                      codigo: DEMO.IND.001
                      nombre: Cobertura de demostración
                      familia:
                        id: '54'
                        codigo: DEMO.F54
                        nombre: Familia de demostración
                        agrupacion:
                          id: '8'
                          codigo: DEMO.08
                          nombre: Agrupación de demostración
                      periodicidad: mensual
                      primer_periodo_exigible: '2026-01-01'
                      disponibilidad_captura: lista
                      pendientes: []
                    paginacion:
                      pagina: 1
                      por_pagina: 20
                      total: 1
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /indicadores/{indicadorId}:
    get:
      operationId: obtenerIndicador
      summary: Consultar ficha y entradas visibles
      description: Captura solo recibe sus entradas capturables; Revisión/Administrador reciben las entradas autorizadas
        globales. La fórmula textual no expone los valores de otras dependencias.
      tags:
      - Indicadores
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: propuesto
      x-pendientes: []
      parameters:
      - $ref: '#/components/parameters/indicadorId'
      responses:
        '200':
          description: Consultar ficha y entradas visibles
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicadorDetalle'
              examples:
                ejemplo:
                  value:
                    indicador:
                      id: '63'
                      codigo: DEMO.IND.001
                      nombre: Cobertura de demostración
                      familia:
                        id: '54'
                        codigo: DEMO.F54
                        nombre: Familia de demostración
                        agrupacion:
                          id: '8'
                          codigo: DEMO.08
                          nombre: Agrupación de demostración
                      periodicidad: mensual
                      primer_periodo_exigible: '2026-01-01'
                      disponibilidad_captura: lista
                      pendientes: []
                    ficha:
                      definicion: Ejemplo sintético, no ficha oficial.
                      objetivo: Ilustrar el recorrido contractual.
                      formula_texto: A / T * 100
                      unidad_medida: '%'
                      medio_verificacion: Reporte municipal PDF de demostración
                      periodo_linea_base: null
                      regla_semaforo_texto: Ejemplo documental; no sustituye una regla oficial.
                      criterio_interpretacion: null
                      observaciones_limitaciones: null
                      unidad_responsable_texto: null
                      desagregacion_origen: null
                      ipsm_origen: null
                      nivel_objetivo: null
                      tipo_indicador: null
                      ambito_desempeno: null
                      dimension_desempeno: null
                      transversalidad: null
                      funcion_indicador: null
                      procedencia: null
                      ids_origen: null
                      justificacion: null
                      linea_base: null
                      meta: null
                      anio_meta: null
                      sentido: ascendente
                      acumulable: false
                    variables_captura:
                    - id: '11'
                      codigo: A
                      descripcion: Cantidad atendida de demostración
                      unidad_medida: unidades
                      tipo_dato: entero
                      papel_calculo: numerador
                      obligatoria: true
                      dependencia_id: '7'
                    - id: '12'
                      codigo: T
                      descripcion: Total de demostración
                      unidad_medida: unidades
                      tipo_dato: entero
                      papel_calculo: denominador
                      obligatoria: true
                      dependencia_id: '7'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /indicadores/{indicadorId}/periodos:
    get:
      operationId: listarPeriodos
      summary: Consultar calendario conocido
      description: Consultar un intervalo acotado; desde<=hasta. Sin calendario aprobado retorna pendiente e intervalos
        históricos conocidos, sin atraso ni apertura ficticios. Una respuesta pendiente no impide leer publicaciones
        existentes.
      tags:
      - Indicadores
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: condicionado
      x-pendientes:
      - P-07
      - P-12
      parameters:
      - $ref: '#/components/parameters/indicadorId'
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Consultar calendario conocido
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendario'
              examples:
                ejemplo:
                  value:
                    indicador_id: '63'
                    estado_calendario: pendiente
                    pendientes:
                    - P-07
                    - P-12
                    items: []
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /indicadores/{indicadorId}/capturas:
    post:
      operationId: enviarCaptura
      summary: Enviar captura completa con PDF
      description: Primer recorrido propuesto para configuración conciliada de una dependencia. expediente_id null
        solo solicita ciclo original inexistente; de lo contrario exigir el ciclo abierto explícito del mismo indicador/periodo.
        Dependencia/autor/estado/número/fechas se obtienen del servidor. PDF real obligatorio y valores completos/únicos.
        Guardado atómico sin borrador. No habilitar F13.002/F16.002 conflictivos ni consolidación por este contrato;
        configuración indefinida:409. Sin idempotencia genérica prometida.
      tags:
      - Captura
      x-roles:
      - captura
      x-prioridad: P0
      x-estado-contrato: condicionado
      x-pendientes:
      - PROP-BD-003
      - ASIGNACIONES
      - P-07
      - P-12
      - PDF
      parameters:
      - $ref: '#/components/parameters/indicadorId'
      - $ref: '#/components/parameters/Csrf'
      responses:
        '201':
          description: Enviar captura completa con PDF
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
            Location:
              description: Recurso de negocio creado.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/capturas/101
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturaDetalle'
              examples:
                ejemplo:
                  value:
                    captura:
                      id: '101'
                      expediente_id: '201'
                      indicador_id: '63'
                      dependencia_id: '7'
                      capturista_id: '1'
                      numero_envio: 1
                      estado: en_revision
                      enviada_en: '2026-10-02T15:00:00Z'
                    descripcion_avance: Reporte municipal completo del periodo de demostración.
                    observaciones_captura: null
                    valores:
                    - variable_id: '11'
                      codigo: A
                      unidad_medida: unidades
                      valor: '80'
                    - variable_id: '12'
                      codigo: T
                      unidad_medida: unidades
                      valor: '100'
                    evidencias:
                    - id: '501'
                      nombre_original: reporte-demostracion.pdf
                      mime_type: application/pdf
                      tamano_bytes: 12000
                      subida_en: '2026-10-02T15:00:00Z'
                    observaciones_pendientes_ids: []
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          $ref: '#/components/responses/CargaExcesiva'
        '415':
          $ref: '#/components/responses/ContenidoNoPermitido'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/NoDisponible'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                datos:
                  $ref: '#/components/schemas/DatosCaptura'
                evidencias:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 1
              required:
              - datos
              - evidencias
              description: Envío completo. Parte datos JSON y uno o varios PDF. Límites de tamaño/cantidad pendientes;
                no aceptar URLs o storage_key del cliente.
            encoding:
              datos:
                contentType: application/json
              evidencias:
                contentType: application/pdf
  /expedientes:
    get:
      operationId: listarExpedientes
      summary: Consultar bandeja autorizada
      description: Captura ve solo ciclos de sus indicadores y sus propios envíos; Revisión bandeja global y Administrador
        supervisión. Orden creado_en DESC,id DESC. No exponer conteos de aportes ajenos.
      tags:
      - Revision
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: propuesto
      x-pendientes: []
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PorPagina'
      - name: indicador_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - abierto
          - validado
      responses:
        '200':
          description: Consultar bandeja autorizada
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaExpedientes'
              examples:
                ejemplo:
                  value:
                    items:
                    - id: '201'
                      indicador_id: '63'
                      periodo:
                        inicio: '2026-09-01'
                        fin: '2026-09-30'
                      numero_ciclo: 1
                      expediente_anterior_id: null
                      estado: abierto
                      capturas:
                      - id: '101'
                        expediente_id: '201'
                        indicador_id: '63'
                        dependencia_id: '7'
                        capturista_id: '1'
                        numero_envio: 1
                        estado: en_revision
                        enviada_en: '2026-10-02T15:00:00Z'
                      aportes_pendientes: false
                      publicacion_vigente_id: null
                    paginacion:
                      pagina: 1
                      por_pagina: 20
                      total: 1
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /expedientes/{expedienteId}:
    get:
      operationId: obtenerExpediente
      summary: Consultar contexto del ciclo
      description: Filtra capturas por dependencia para Captura. aportes_pendientes es solo un indicador general.
        publicacion_vigente_id puede apuntar al ciclo validado anterior mientras este está abierto. No devuelve
        JSONB de configuración/antecedentes.
      tags:
      - Revision
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: propuesto
      x-pendientes: []
      parameters:
      - $ref: '#/components/parameters/expedienteId'
      responses:
        '200':
          description: Consultar contexto del ciclo
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expediente'
              examples:
                ejemplo:
                  value:
                    id: '201'
                    indicador_id: '63'
                    periodo:
                      inicio: '2026-09-01'
                      fin: '2026-09-30'
                    numero_ciclo: 1
                    expediente_anterior_id: null
                    estado: abierto
                    capturas:
                    - id: '101'
                      expediente_id: '201'
                      indicador_id: '63'
                      dependencia_id: '7'
                      capturista_id: '1'
                      numero_envio: 1
                      estado: en_revision
                      enviada_en: '2026-10-02T15:00:00Z'
                    aportes_pendientes: false
                    publicacion_vigente_id: null
                validado:
                  value:
                    id: '201'
                    indicador_id: '63'
                    periodo:
                      inicio: '2026-09-01'
                      fin: '2026-09-30'
                    numero_ciclo: 1
                    expediente_anterior_id: null
                    estado: validado
                    capturas:
                    - id: '101'
                      expediente_id: '201'
                      indicador_id: '63'
                      dependencia_id: '7'
                      capturista_id: '1'
                      numero_envio: 1
                      estado: revisada
                      enviada_en: '2026-10-02T15:00:00Z'
                    aportes_pendientes: false
                    publicacion_vigente_id: '201'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /expedientes/{expedienteId}/eventos:
    get:
      operationId: listarEventos
      summary: Consultar hilo de revisión
      description: Orden creado_en,id ascendente. Captura ve eventos de sus envíos y metadatos de validación/reapertura
        del ciclo; comentarios ajenos/globales sensibles se suprimen. Respuestas/resoluciones pertenecen al mismo
        ciclo. No existe escritura libre de eventos.
      tags:
      - Revision
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P0
      x-estado-contrato: propuesto
      x-pendientes: []
      parameters:
      - $ref: '#/components/parameters/expedienteId'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Consultar hilo de revisión
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEventos'
              examples:
                ejemplo:
                  value:
                    items:
                    - id: '301'
                      expediente_id: '201'
                      captura_id: '101'
                      autor_id: '2'
                      rol_al_actuar: revision
                      accion: observar
                      estado_anterior: en_revision
                      estado_nuevo: observada
                      comentario: Aclare el respaldo de la cantidad atendida.
                      responde_a_id: null
                      creado_en: '2026-10-02T16:00:00Z'
                    paginacion:
                      pagina: 1
                      por_pagina: 20
                      total: 1
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
