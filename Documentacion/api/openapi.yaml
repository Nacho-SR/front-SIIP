  /notificaciones:
    get:
      operationId: listarNotificaciones
      summary: Consultar avisos propios
      description: Bandeja interna propuesta; no presupone correo ni canales externos. Solo usuario_id de la sesión,
        antes de paginar/contar. Orden creada_en DESC,id DESC. Sin avisos:items=[].
      tags:
      - Notificaciones
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P1
      x-estado-contrato: condicionado
      x-pendientes:
      - P-14
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PorPagina'
      - name: leida
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Consultar avisos propios
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaNotificaciones'
              examples:
                ejemplo:
                  value:
                    items:
                    - id: '601'
                      indicador_id: '63'
                      periodo:
                        inicio: '2026-09-01'
                        fin: '2026-09-30'
                      tipo: observacion
                      mensaje: Tiene una observación en un envío de su dependencia.
                      creada_en: '2026-10-02T16:00:00Z'
                      leida_en: null
                    paginacion:
                      pagina: 1
                      por_pagina: 20
                      total: 1
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /notificaciones/{notificacionId}/lectura:
    post:
      operationId: marcarNotificacionLeida
      summary: Marcar aviso propio como leído
      description: Solo destinatario actual. No recibe usuario_id ni permite cambiar mensaje/tipo. Repetir devuelve
        200 con la fecha de primera lectura; no genera otro aviso. Un aviso ajeno devuelve404.
      tags:
      - Notificaciones
      x-roles:
      - captura
      - revision
      - administrador
      x-prioridad: P1
      x-estado-contrato: condicionado
      x-pendientes:
      - P-14
      parameters:
      - $ref: '#/components/parameters/notificacionId'
      - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Marcar aviso propio como leído
          headers:
            Cache-Control:
              description: No almacenar datos privados ni respuestas autenticadas.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
              examples:
                ejemplo:
                  value:
                    id: '601'
                    indicador_id: '63'
                    periodo:
                      inicio: '2026-09-01'
                      fin: '2026-09-30'
                    tipo: observacion
                    mensaje: Tiene una observación en un envío de su dependencia.
                    creada_en: '2026-10-02T16:00:00Z'
                    leida_en: '2026-10-02T17:00:00Z'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
