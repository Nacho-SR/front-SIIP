components:
  securitySchemes:
    SesionCookie:
      type: apiKey
      in: cookie
      name: siip_session
      description: Propuesta de sesión opaca servidor; cookie HttpOnly/Secure/SameSite=Lax. En escrituras validar
        X-CSRF-Token y Origin. Rol/dependencia se verifican desde cuenta vigente, no por scopes ni campos del cliente.
  parameters:
    indicadorId:
      name: indicadorId
      in: path
      required: true
      description: Identificador del recurso, sujeto a autorización por objeto.
      schema:
        $ref: '#/components/schemas/Id'
    expedienteId:
      name: expedienteId
      in: path
      required: true
      description: Identificador del recurso, sujeto a autorización por objeto.
      schema:
        $ref: '#/components/schemas/Id'
    capturaId:
      name: capturaId
      in: path
      required: true
      description: Identificador del recurso, sujeto a autorización por objeto.
      schema:
        $ref: '#/components/schemas/Id'
    evidenciaId:
      name: evidenciaId
      in: path
      required: true
      description: Identificador del recurso, sujeto a autorización por objeto.
      schema:
        $ref: '#/components/schemas/Id'
    agrupacionId:
      name: agrupacionId
      in: path
      required: true
      description: Identificador del recurso, sujeto a autorización por objeto.
      schema:
        $ref: '#/components/schemas/Id'
    notificacionId:
      name: notificacionId
      in: path
      required: true
      description: Identificador del recurso, sujeto a autorización por objeto.
      schema:
        $ref: '#/components/schemas/Id'
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token de GET /auth/sesion; validar también Origin. Se exige en escrituras, incluido login.
      schema:
        type: string
        minLength: 16
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: bigint positivo como cadena; backend comprueba máximo 9223372036854775807.
      examples:
      - '201'
    Decimal:
      type: string
      pattern: ^-?(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,8})?$
      description: numeric(24,8) como cadena, finito y sin notación exponencial. Rangos/unidad por variable.
      examples:
      - '80.00000000'
    Rol:
      type: string
      enum:
      - captura
      - revision
      - administrador
    Color:
      type: string
      enum:
      - verde
      - amarillo
      - rojo
    Periodo:
      type: object
      additionalProperties: false
      properties:
        inicio:
          type: string
          format: date
        fin:
          type: string
          format: date
      required:
      - inicio
      - fin
      description: Extremos inclusivos; backend comprueba fin >= inicio y calendario aplicable.
      examples:
      - inicio: '2026-09-01'
        fin: '2026-09-30'
    Paginacion:
      type: object
      additionalProperties: false
      properties:
        pagina:
          type: integer
          minimum: 1
        por_pagina:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - pagina
      - por_pagina
      - total
    Usuario:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        dependencia_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - id
      - nombre
      - correo
      - rol
      - dependencia_id
      examples:
      - id: '1'
        nombre: Capturista de demostración
        correo: captura@example.test
        rol: captura
        dependencia_id: '7'
    Sesion:
      type: object
      additionalProperties: false
      properties:
        usuario:
          anyOf:
          - $ref: '#/components/schemas/Usuario'
          - type: 'null'
        csrf_token:
          type: string
          minLength: 16
      required:
      - usuario
      - csrf_token
      description: Propuesta de sesión con cookie opaca. CSRF se rota al autenticar; no contiene contraseña ni token
        Bearer.
      examples:
      - usuario: null
        csrf_token: csrf_sintetico_bootstrap_2026
    Credenciales:
      type: object
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - correo
      - password
      examples:
      - correo: captura@example.test
        password: SoloEjemploDocumental!2026
    Agrupacion:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        codigo:
          type: string
        nombre:
          type: string
      required:
      - id
      - codigo
      - nombre
      examples:
      - id: '8'
        codigo: DEMO.08
        nombre: Agrupación de demostración
    Familia:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        codigo:
          type: string
        nombre:
          type: string
        agrupacion:
          $ref: '#/components/schemas/Agrupacion'
      required:
      - id
      - codigo
      - nombre
      - agrupacion
      examples:
      - id: '54'
        codigo: DEMO.F54
        nombre: Familia de demostración
        agrupacion:
          id: '8'
          codigo: DEMO.08
          nombre: Agrupación de demostración
    Indicador:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        codigo:
          type: string
        nombre:
          type: string
        familia:
          $ref: '#/components/schemas/Familia'
        periodicidad:
          anyOf:
          - type: string
            enum:
            - mensual
            - trimestral
            - semestral
            - anual
          - type: 'null'
        primer_periodo_exigible:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        disponibilidad_captura:
          type: string
          enum:
          - lista
          - pendiente
        pendientes:
          type: array
          items:
            type: string
      required:
      - id
      - codigo
      - nombre
      - familia
      - periodicidad
      - primer_periodo_exigible
      - disponibilidad_captura
      - pendientes
      examples:
      - id: '63'
        codigo: DEMO.IND.001
        nombre: Cobertura de demostración
        familia:
          id: '54'
          codigo: DEMO.F54
          nombre: Familia de demostración
          agrupacion:
            id: '8'
            codigo: DEMO.08
            nombre: Agrupación de demostración
        periodicidad: mensual
        primer_periodo_exigible: '2026-01-01'
        disponibilidad_captura: lista
        pendientes: []
    VariableVisible:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        codigo:
          type: string
        descripcion:
          type: string
        unidad_medida:
          anyOf:
          - type: string
          - type: 'null'
        tipo_dato:
          anyOf:
          - type: string
            enum:
